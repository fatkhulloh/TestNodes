<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Task List</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
body { font-family: Arial; padding: 20px; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.add {
  background: #2ecc71;
  color: white;
  padding: 8px 14px;
  text-decoration: none;
  border-radius: 4px;
}

table { width: 100%; border-collapse: collapse; margin-top: 15px; }
th, td { border: 1px solid #ddd; padding: 10px; }
th { background: #f4f4f4; }

.edit { background: #3498db; color: white; padding: 6px 10px; border-radius: 4px; }
.delete { background: #e74c3c; color: white; padding: 6px 10px; border-radius: 4px; }
</style>
</head>
<body>

<div class="header">
  <h2>Task List</h2>
  <a href="create.html" class="add">+ Tambah Data</a>
</div>

<table>
<thead>
<tr>
  <th>ID</th>
  <th>Title</th>
  <th>Description</th>
  <th>Status</th>
  <th>Due Date</th>
  <th>Aksi</th>
</tr>
</thead>
<tbody id="tasks"></tbody>
</table>

<script>
const API = 'http://localhost:3001/api/tasks';

axios.get(API)
.then(res => {
  let html = '';
  res.data.forEach(t => {
    html += `
      <tr>
        <td>${t.id}</td>
        <td>${t.title}</td>
        <td>${t.description}</td>
        <td>${t.status}</td>
        <td>${t.due_date}</td>
        <td>
          <a href="edit.html?id=${t.id}" class="edit">Edit</a>
          <a href="delete.html?id=${t.id}" class="delete">Hapus</a>
        </td>
      </tr>
    `;
  });
  document.getElementById('tasks').innerHTML = html;
});
</script>

</body>
</html>
