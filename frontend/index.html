<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Todo Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Todo List</h2>
<Button class="edit">Tambah Data</Button>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Description</th>
      <th>Status</th>
      <th>Due Date</th>
      <th>Aksi</th>
    </tr>
  </thead>
  <tbody id="todoTable"></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
